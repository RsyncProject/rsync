name: Directed transfers
description: Native SSH and daemon transfers between seven endpoints
inputs:
  platform:
    required: true
    description: Native endpoint
  guest:
    default: 'false'
    description: Use the existing local VM SSH connection
outputs:
  blocked:
    description: A shared phase could not run
    value: ${{ steps.outcome.outputs.blocked }}
runs:
  using: composite
  steps:
    - name: Install Tailscale
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py install "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Generate enrolment recipient
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py recipient "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload recipient
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-public-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/public-key.json
        if-no-files-found: error
        retention-days: 7
    - name: Join quarantine
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py connect "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Start native fixture services
      if: env.INTEROP_BLOCKED != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py prepare "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload endpoint identity
      if: env.INTEROP_BLOCKED != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-ready-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/ready.json
        if-no-files-found: error
        retention-days: 7
    - name: Check quarantine
      if: env.INTEROP_BLOCKED != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py quarantine "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload quarantine result
      if: env.INTEROP_BLOCKED != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-quarantine-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/quarantine.json
        if-no-files-found: error
        retention-days: 7
    - name: Check admission
      if: env.INTEROP_BLOCKED != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py admit "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload endpoint admission
      if: env.INTEROP_BLOCKED != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-admitted-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/admitted.json
        if-no-files-found: error
        retention-days: 7
    - name: Initial transfers
      id: transfer1
      if: env.INTEROP_BLOCKED != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py transfer1 "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload initial transfer completion
      id: transfer1_upload
      if: ${{ always() && !cancelled() && env.INTEROP_BLOCKED != 'true' && (steps.transfer1.outcome == 'success' || steps.transfer1.outcome == 'failure') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-transfer1-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/transfer1.json
        if-no-files-found: error
        retention-days: 7
    - name: Complete initial transfer phase
      if: ${{ always() && !cancelled() && steps.transfer1_upload.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
      run: python3 -B -S .github/scripts/interop-host.py wait1 "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Verify initial data and update sources
      if: env.INTEROP_BLOCKED != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py next "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload update readiness
      if: env.INTEROP_BLOCKED != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-next-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/next.json
        if-no-files-found: error
        retention-days: 7
    - name: Checksum updates and deletion
      id: transfer2
      if: env.INTEROP_BLOCKED != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py transfer2 "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload update completion
      id: transfer2_upload
      if: ${{ always() && !cancelled() && env.INTEROP_BLOCKED != 'true' && (steps.transfer2.outcome == 'success' || steps.transfer2.outcome == 'failure') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-transfer2-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/transfer2.json
        if-no-files-found: error
        retention-days: 7
    - name: Complete updated transfer phase
      if: ${{ always() && !cancelled() && steps.transfer2_upload.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
      run: python3 -B -S .github/scripts/interop-host.py wait2 "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Verify updated native data
      if: env.INTEROP_BLOCKED != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py verify "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload transfer result
      if: env.INTEROP_BLOCKED != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-result-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/result.json
        if-no-files-found: error
        retention-days: 7
    - name: Check revocation
      if: env.INTEROP_BLOCKED != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py revoked "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Upload revocation result
      if: env.INTEROP_BLOCKED != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-revoked-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/revoked.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload blocked phase
      if: ${{ always() && env.INTEROP_BLOCKED == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: interoperability-blocked-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/interoperability/blocked.json
        if-no-files-found: error
        retention-days: 7
    - name: Stop fixture services and leave the network
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INTEROP_PLATFORM: ${{ inputs.platform }}
        INTEROP_GUEST: ${{ inputs.guest }}
      run: python3 -B -S .github/scripts/interop-host.py stop "$INTEROP_PLATFORM" --root "$RUNNER_TEMP/interoperability"
    - name: Record endpoint outcome
      id: outcome
      if: always()
      shell: bash
      run: |
        python3 -B -S - <<'PY'
        import os
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('blocked=' + os.environ.get('INTEROP_BLOCKED', 'false') + '\n')
        PY
