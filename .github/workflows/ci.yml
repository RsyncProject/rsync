name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '42 8 * * 0,2-6'
    - cron: '42 8 * * 1'
    - cron: '52 8 * * 1'
    - cron: '42 9 * * 1'
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    if: &daily ${{ github.event_name != 'schedule' || github.event.schedule == '42 8 * * 0,2-6' || github.event.schedule == '42 8 * * 1' }}
    uses: ./.github/workflows/linux.yml
    with:
      ubuntu: &weekly ${{ github.event_name != 'schedule' || github.event.schedule == '42 8 * * 1' }}
      almalinux: *daily
      alpine: *weekly

  bsd:
    name: BSD
    if: *weekly
    uses: ./.github/workflows/bsd.yml

  macos:
    if: *daily
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '15'
            arch: arm64
            runner: macos-15
          - release: '15'
            arch: x86_64
            runner: macos-15-intel
          - release: '26'
            arch: arm64
            runner: macos-26
          - release: '26'
            arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    name: macOS ${{ matrix.release }} ${{ matrix.arch == 'x86_64' && 'AMD64' || 'ARM64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Platform
        run: |
          sw_vers
          uname -a
          test "$(uname -s)" = Darwin
          test "$(sw_vers -productVersion | cut -d. -f1)" = '${{ matrix.release }}'
          test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Build and test
        uses: ./.github/actions/macos
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: macos-${{ matrix.release }}-${{ matrix.arch }}-bin
          path: |
            rsync
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: macos-${{ matrix.release }}-${{ matrix.arch }}-results
          if-no-files-found: error
          path: |
            config.log
            ${{ runner.temp }}/rsync-checks/features.json
            ${{ runner.temp }}/rsync-checks/dirfd-probe.tsv
            ${{ runner.temp }}/rsync-checks/*/receipt.json
            ${{ runner.temp }}/rsync-checks/*/run.log

  cygwin:
    if: *daily
    runs-on: windows-2022
    timeout-minutes: 60
    name: Cygwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and test
        uses: ./.github/actions/cygwin
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: cygwin-bin
          path: |
            rsync.exe
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync

  solaris:
    if: *weekly
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: Solaris
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare VM host
        timeout-minutes: 10
        run: |
          packages=(qemu-utils qemu-system-x86 ovmf)
          sudo apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends "${packages[@]}" || {
            sudo apt-get update -q
            sudo apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends "${packages[@]}"
          }
      - name: Build and test
        id: test
        uses: vmactions/solaris-vm@87d3c436511cef802cd1637f86f73b1a97715c8c # v1.4.1
        with:
          cache-after-prepare: true
          prepare: |
            pkg install bash automake gnu-m4 pkg://solaris/runtime/python-35 autoconf gcc git
          run: |
            mkdir -p test-results
            result=$PWD/test-results/status
            trap 'status=$?; printf "%s\n" "$status" > "$result"; exit 0' EXIT
            uname -a
            ./configure --with-rrsync --disable-zstd --disable-md2man --disable-xxhash --disable-lz4 --disable-idn
            make check-progs
            ./rsync --version
            status=0
            sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,non-asan,root,self-peer,solaris,no-idn,no-xxhash,no-zstd-threads" "$PWD/test-results/root/pipe" -j8 || status=1
            sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "non-asan,root,self-peer,solaris,no-idn,no-xxhash,no-zstd-threads" "$PWD/test-results/root/tcp" --use-tcp --daemon-tests-only -j8 || status=1
            exit "$status"
      - name: Check result
        run: test "$(cat test-results/status)" = 0
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: solaris-bin
          path: |
            rsync
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: solaris-results
          if-no-files-found: error
          path: |
            config.log
            test-results/status
            test-results/*/*/receipt.json
            test-results/*/*/run.log

  android:
    name: Android
    if: *weekly
    uses: ./.github/workflows/android.yml

  versions:
    name: Version mix
    if: &versions ${{ github.event_name != 'schedule' || github.event.schedule == '52 8 * * 1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev python3-cmarkgfm openssl
          echo "/usr/local/bin" >>"$GITHUB_PATH"
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        run: make check-progs
      - name: Version
        run: ./rsync --version | head -1
      - name: Validate profiles
        run: ./testsuite/runtests.py profile --rsync-bin="$PWD/rsync"
      - name: Tests (non-root pipe and TCP)
        run: |
          mkdir -p test-results/version-mix
          rc=0
          for peer in old_versions/rsync_*; do
            chmod +x "$peer"
            name=$(basename "$peer")
            profile="peer-${name#rsync_}"
            for transport in pipe tcp; do
              tcp=()
              [ "$transport" = tcp ] && tcp=(--use-tcp --daemon-tests-only)
              echo "::group::$name ($transport): $("$peer" --version | head -1)"
              if ! ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --rsync-bin2="$PWD/$peer" \
                    --profiles="linux,pre-3.4.3,$profile" --receipt="test-results/version-mix/$name-$transport.json" \
                    "${tcp[@]}" -j 8; then
                echo "::error::version-mix failed: $name ($transport)"
                rc=1
              fi
              echo "::endgroup::"
            done
          done
          exit $rc
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-mix-receipts
          path: test-results/version-mix

  diagnostics:
    name: Analysis
    if: &diagnostics ${{ github.event_name != 'schedule' || github.event.schedule == '42 9 * * 1' || github.event.schedule == '17 4 * * *' }}
    uses: ./.github/workflows/diagnostics.yml
    with:
      lint: &regular ${{ github.event_name != 'schedule' }}
      asan: &instrumented ${{ github.event_name != 'schedule' || github.event.schedule == '42 9 * * 1' }}
      coverage: *instrumented
      scan_pinned: *regular
      scan_latest: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '42 9 * * 1') }}
      valgrind: ${{ github.event_name != 'schedule' || github.event.schedule == '17 4 * * *' }}

  required:
    name: Required
    if: always()
    needs: [linux, bsd, macos, cygwin, solaris, android, versions, diagnostics]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_DIRECT_JOBS: '["macos","cygwin","solaris","versions"]'
      CI_EXPECT_LINUX: *daily
      CI_EXPECT_BSD: *weekly
      CI_EXPECT_MACOS: *daily
      CI_EXPECT_CYGWIN: *daily
      CI_EXPECT_SOLARIS: *weekly
      CI_EXPECT_ANDROID: *weekly
      CI_EXPECT_VERSIONS: *versions
      CI_EXPECT_DIAGNOSTICS: *diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check results
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$CI_RESULTS" | jq -er -f .github/check-results.jq
