name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '42 8 * * 0,2-6'
    - cron: '42 8 * * 1'
    - cron: '52 8 * * 1'
    - cron: '42 9 * * 1'
    - cron: '17 4 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: sh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    if: &daily ${{ github.event_name != 'schedule' || github.event.schedule == '42 8 * * 0,2-6' || github.event.schedule == '42 8 * * 1' }}
    uses: ./.github/workflows/linux.yml
    with:
      ubuntu: &weekly ${{ github.event_name != 'schedule' || github.event.schedule == '42 8 * * 1' }}
      almalinux: *daily
      alpine: *weekly

  bsd:
    name: BSD
    if: *weekly
    uses: ./.github/workflows/bsd.yml

  macos:
    name: macOS
    if: *daily
    uses: ./.github/workflows/macos.yml

  other:
    name: Other
    if: &other ${{ github.event_name != 'schedule' || github.event.schedule == '42 8 * * 0,2-6' || github.event.schedule == '42 8 * * 1' || github.event.schedule == '52 8 * * 1' }}
    uses: ./.github/workflows/other.yml
    with:
      cygwin: *daily
      solaris: *weekly
      versions: ${{ github.event_name != 'schedule' || github.event.schedule == '52 8 * * 1' }}

  android:
    name: Android
    if: *weekly
    uses: ./.github/workflows/android.yml

  diagnostics:
    name: Diagnostics
    if: &diagnostics ${{ github.event_name != 'schedule' || github.event.schedule == '42 9 * * 1' || github.event.schedule == '17 4 * * *' }}
    uses: ./.github/workflows/diagnostics.yml
    with:
      lint: &regular ${{ github.event_name != 'schedule' }}
      asan: &instrumented ${{ github.event_name != 'schedule' || github.event.schedule == '42 9 * * 1' }}
      coverage: *instrumented
      scan_pinned: *regular
      scan_latest: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '42 9 * * 1') }}
      valgrind: ${{ github.event_name != 'schedule' || github.event.schedule == '17 4 * * *' }}

  required:
    name: Required
    if: always()
    needs: [linux, bsd, macos, other, android, diagnostics]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_EXPECT_LINUX: *daily
      CI_EXPECT_BSD: *weekly
      CI_EXPECT_MACOS: *daily
      CI_EXPECT_OTHER: *other
      CI_EXPECT_ANDROID: *weekly
      CI_EXPECT_DIAGNOSTICS: *diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check results
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -S .github/scripts/check-results.py
