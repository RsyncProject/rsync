name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '42 8 * * 0,2-6'
    - cron: '42 8 * * 1'
    - cron: '52 8 * * 1'
    - cron: '42 9 * * 1'
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    if: &daily ${{ github.event_name != 'schedule' || github.event.schedule == '42 8 * * 0,2-6' || github.event.schedule == '42 8 * * 1' }}
    uses: ./.github/workflows/linux.yml
    with:
      ubuntu: &weekly ${{ github.event_name != 'schedule' || github.event.schedule == '42 8 * * 1' }}
      almalinux: *daily

  bsd:
    name: BSD
    if: *weekly
    uses: ./.github/workflows/bsd.yml

  macos:
    if: *daily
    runs-on: macos-latest
    timeout-minutes: 45
    name: macOS
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and test
        uses: ./.github/actions/macos
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: macos-bin
          path: |
            rsync
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: macos-results
          if-no-files-found: error
          path: |
            config.log
            ${{ runner.temp }}/rsync-checks/features.json
            ${{ runner.temp }}/rsync-checks/*/receipt.json
            ${{ runner.temp }}/rsync-checks/*/run.log

  cygwin:
    if: *daily
    runs-on: windows-2022
    timeout-minutes: 60
    name: Cygwin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and test
        uses: ./.github/actions/cygwin
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: cygwin-bin
          path: |
            rsync.exe
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync

  solaris:
    if: *weekly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Solaris
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare VM host
        timeout-minutes: 10
        run: |
          packages=(qemu-utils qemu-system-x86 ovmf)
          sudo apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends "${packages[@]}" || {
            sudo apt-get update -q
            sudo apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends "${packages[@]}"
          }
      - name: Build and test
        id: test
        uses: vmactions/solaris-vm@87d3c436511cef802cd1637f86f73b1a97715c8c # v1.4.1
        with:
          cache-after-prepare: true
          prepare: |
            pkg install bash automake gnu-m4 pkg://solaris/runtime/python-35 autoconf gcc git
          run: |
            mkdir -p test-results
            result=$PWD/test-results/status
            trap 'status=$?; printf "%s\n" "$status" > "$result"; exit 0' EXIT
            uname -a
            ./configure --with-rrsync --disable-zstd --disable-md2man --disable-xxhash --disable-lz4 --disable-idn
            make check-progs
            ./rsync --version
            status=0
            sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,non-asan,root,self-peer,solaris,no-idn,no-xxhash,no-zstd-threads" "$PWD/test-results/root/pipe" -j8 || status=1
            sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "non-asan,root,self-peer,solaris,no-idn,no-xxhash,no-zstd-threads" "$PWD/test-results/root/tcp" --use-tcp --daemon-tests-only -j8 || status=1
            ./rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
            exit "$status"
      - name: Check result
        run: test "$(cat test-results/status)" = 0
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: solaris-bin
          path: |
            rsync
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: solaris-results
          if-no-files-found: error
          path: |
            config.log
            test-results/status
            test-results/*/*/receipt.json
            test-results/*/*/run.log

  android:
    name: Android
    if: *weekly
    uses: ./.github/workflows/android.yml

  versions:
    name: Versions
    if: &versions ${{ github.event_name != 'schedule' || github.event.schedule == '52 8 * * 1' }}
    uses: ./.github/workflows/versions.yml

  diagnostics:
    name: Diagnostics
    if: &diagnostics ${{ github.event_name != 'schedule' || github.event.schedule == '42 9 * * 1' || github.event.schedule == '17 4 * * *' }}
    uses: ./.github/workflows/diagnostics.yml
    with:
      lint: &regular ${{ github.event_name != 'schedule' }}
      asan: &instrumented ${{ github.event_name != 'schedule' || github.event.schedule == '42 9 * * 1' }}
      coverage: *instrumented
      scan_pinned: *regular
      scan_latest: *regular
      valgrind: ${{ github.event_name != 'schedule' || github.event.schedule == '17 4 * * *' }}

  required:
    name: Required
    if: always()
    needs: [linux, bsd, macos, cygwin, solaris, android, versions, diagnostics]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_DIRECT_JOBS: '["macos","cygwin","solaris"]'
      CI_EXPECT_LINUX: *daily
      CI_EXPECT_BSD: *weekly
      CI_EXPECT_MACOS: *daily
      CI_EXPECT_CYGWIN: *daily
      CI_EXPECT_SOLARIS: *weekly
      CI_EXPECT_ANDROID: *weekly
      CI_EXPECT_VERSIONS: *versions
      CI_EXPECT_DIAGNOSTICS: *diagnostics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check results
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$CI_RESULTS" | jq -er -f .github/check-results.jq
