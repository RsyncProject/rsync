name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '42 8 * * 0,2-6'
    - cron: '42 8 * * 1'
    - cron: '52 8 * * 1'
    - cron: '42 9 * * 1'
    - cron: '17 4 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: sh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  interoperability:
    name: Interoperability
    if: &interoperability ${{ github.event_name != 'schedule' }}
    uses: ./.github/workflows/interoperability-tests.yml
    permissions:
      contents: read
      actions: read

  required:
    name: Required
    if: always()
    needs: [interoperability]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_EXPECT_INTEROPERABILITY: *interoperability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check results
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -S .github/scripts/check-results.py
      - name: Full CI required
        run: python3 -c "raise SystemExit('Full CI is temporarily disabled')"
