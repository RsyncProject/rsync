name: Android

on:
  workflow_call:
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}
      inputs:
        description: Job selections
        value: '{"bionic": true, "termux": true}'

permissions:
  contents: read

defaults:
  run:
    shell: sh

env:
  ANDROID_API: 24

jobs:
  bionic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: ${{ matrix.name }}
    env:
      ANDROID_TRIPLE: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bionic API 24 ARM64
            abi: arm64-v8a
            triple: aarch64-linux-android
            executor: qemu-aarch64-static
            packages: qemu-user-static
          - name: Bionic API 24 ARMv7
            abi: armeabi-v7a
            triple: armv7a-linux-androideabi
            executor: qemu-arm-static
            packages: qemu-user-static
          - name: Bionic API 24 X86-64
            abi: x86_64
            triple: x86_64-linux-android
            executor: direct
            packages: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake gawk ${{ matrix.packages }}

      - &build
        name: Build
        run: |
          set -eu
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TC/${ANDROID_TRIPLE}${ANDROID_API}-clang"
          export CXX="$TC/${ANDROID_TRIPLE}${ANDROID_API}-clang++"
          export AR="$TC/llvm-ar" RANLIB="$TC/llvm-ranlib" STRIP="$TC/llvm-strip"
          export CFLAGS="-O2" LDFLAGS="-static"

          # Bionic hides lchmod and lutimes before API 36; cross-builds cannot run probes
          export ac_cv_func_lchmod=no ac_cv_func_lutimes=no \
                 rsync_cv_HAVE_SOCKETPAIR=yes \
                 rsync_cv_MKNOD_CREATES_FIFOS=yes \
                 rsync_cv_MKNOD_CREATES_SOCKETS=yes

          ./configure --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
            --enable-ipv6 \
            --disable-zstd --disable-lz4 --disable-xxhash --disable-openssl --disable-idn \
            --disable-iconv --disable-iconv-open \
            --disable-acl-support --disable-xattr-support \
            --disable-md2man --disable-roll-simd \
            --with-included-popt --with-included-zlib

          # Generate shared headers before the parallel build
          make proto.h
          make -j"$(nproc)" rsync
          "$STRIP" rsync

      - name: Tests
        run: python3 -S .github/scripts/android.py test --executor "${{ matrix.executor }}"

      - name: Package
        run: python3 -S .github/scripts/android.py package --abi "${{ matrix.abi }}"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: dist/

  termux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: Termux X86-64
    env:
      ANDROID_TRIPLE: x86_64-linux-android
      TERMUX_IMAGE: termux/termux-docker@sha256:f993e5e7ef97b96af774e7062556ac51479fdccc3c3d2240748a3d04b857ce04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake gawk
      - *build
      - name: Prepare Termux
        run: |
          set -eu
          docker pull "$TERMUX_IMAGE"
          docker image inspect --format '{{.RepoDigests}}' "$TERMUX_IMAGE"
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$TERMUX_IMAGE")
          echo "$platform"
          [ "$platform" = linux/amd64 ]
      - name: Tests
        run: |
          docker run --rm --network none --user 1000:1000 --cap-drop ALL \
            --pids-limit 256 --memory 1g \
            --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            "$TERMUX_IMAGE" sh /workspace/.github/scripts/android-transfer.sh direct /workspace/rsync
