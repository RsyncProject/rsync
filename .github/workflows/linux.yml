name: Linux

on:
  workflow_call:
    inputs:
      ubuntu:
        required: true
        type: boolean
      almalinux:
        required: true
        type: boolean
      alpine:
        required: true
        type: boolean
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}
      inputs:
        description: Job selections
        value: ${{ toJSON(inputs) }}

permissions:
  contents: read

jobs:
  ubuntu:
    if: ${{ inputs.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '26.04'
            arch: amd64
            machine: x86_64
            runner: ubuntu-26.04
            install_smoke: true
            profiles: non-asan,self-peer,linux
          - release: '24.04'
            arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
            install_smoke: true
            profiles: non-asan,self-peer,linux
          - release: '22.04'
            arch: amd64
            machine: x86_64
            runner: ubuntu-22.04
            install_smoke: false
            profiles: non-asan,self-peer,linux,no-zstd-threads
          - release: '26.04'
            arch: arm64
            machine: aarch64
            runner: ubuntu-26.04-arm
            install_smoke: true
            profiles: non-asan,self-peer,linux,no-simd
          - release: '24.04'
            arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
            install_smoke: true
            profiles: non-asan,self-peer,linux,no-simd
          - release: '22.04'
            arch: arm64
            machine: aarch64
            runner: ubuntu-22.04-arm
            install_smoke: false
            profiles: non-asan,self-peer,linux,no-simd,no-zstd-threads
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    name: Ubuntu ${{ matrix.release }} ${{ matrix.arch == 'amd64' && 'AMD64' || 'ARM64' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev python3-cmarkgfm openssl
          sudo sysctl -w fs.protected_regular=2
          echo "/usr/local/bin" >>"$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/rsync-checks"
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        run: make check-progs
      - name: Installation check
        if: matrix.install_smoke
        run: |
          set -e
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          make install-all DESTDIR="$tmp"

          for path in \
            /usr/local/bin/rsync \
            /usr/local/bin/rsync-ssl \
            /usr/local/bin/rrsync \
            /usr/local/share/man/man1/rsync.1 \
            /usr/local/share/man/man1/rsync-ssl.1 \
            /usr/local/share/man/man1/rrsync.1 \
            /usr/local/share/man/man5/rsyncd.conf.5 \
            /etc/stunnel/rsyncd.conf
          do
            test -e "$tmp$path"
          done

          make uninstall-all DESTDIR="$tmp"

          leftover="$(find "$tmp" -type f -print)"
          if [ -n "$leftover" ]; then
            printf '%s\n' "$leftover"
            exit 1
          fi
      - name: Install
        run: sudo make install
      - name: Version
        run: |
          . /etc/os-release
          printf '%s %s\n' "$ID" "$VERSION_ID"
          uname -a
          test "$ID" = ubuntu
          test "$VERSION_ID" = "${{ matrix.release }}"
          test "$(uname -m)" = "${{ matrix.machine }}"
          ./rsync --version
      - name: Tests (root pipe)
        run: sudo sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,root,${{ matrix.profiles }}" "$RUNNER_TEMP/rsync-checks/root-pipe" -j8
      - name: Tests (protocol 30)
        run: sudo sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,root,${{ matrix.profiles }},protocol-30" "$RUNNER_TEMP/rsync-checks/root-protocol-30" --protocol=30 -j8
      - name: Tests (protocol 29)
        run: sudo sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,root,${{ matrix.profiles }},protocol-29" "$RUNNER_TEMP/rsync-checks/root-protocol-29" --protocol=29 -j8
      - name: Tests (root TCP)
        run: sudo sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "root,${{ matrix.profiles }}" "$RUNNER_TEMP/rsync-checks/root-tcp" --use-tcp --daemon-tests-only -j8
      - name: Tests (non-root pipe)
        run: sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,nonroot,${{ matrix.profiles }}" "$RUNNER_TEMP/rsync-checks/nonroot-pipe" -j8
      - name: Tests (non-root TCP)
        run: sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "nonroot,${{ matrix.profiles }}" "$RUNNER_TEMP/rsync-checks/nonroot-tcp" --use-tcp --daemon-tests-only -j8
      - name: TLS listing (optional)
        run: rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: ubuntu-${{ matrix.release }}-${{ matrix.arch }}-bin
          if-no-files-found: error
          path: |
            rsync
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: ubuntu-${{ matrix.release }}-${{ matrix.arch }}-results
          if-no-files-found: error
          path: |
            config.log
            ${{ runner.temp }}/rsync-checks/*/receipt.json
            ${{ runner.temp }}/rsync-checks/*/run.log

  almalinux:
    if: ${{ inputs.almalinux }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: almalinux:8
    name: AlmaLinux 8
    steps:
      - name: Install Git
        run: dnf -y install git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          # RHEL 8's default Python is too old for the test runner
          dnf -y install epel-release
          dnf config-manager --set-enabled powertools
          dnf -y install gcc gcc-c++ make autoconf automake m4 \
              python39 python39-pip diffutils \
              openssl openssl-devel \
              attr libattr-devel acl libacl-devel \
              zstd libzstd-devel \
              lz4 lz4-devel \
              xxhash xxhash-devel \
              libidn2 libidn2-devel
          alternatives --set python3 /usr/bin/python3.9
          pip3 install commonmark
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        run: make
      - name: Version
        run: ./rsync --version
      - name: Tests (root pipe)
        run: RSYNC_TEST_PROFILES=pipe,non-asan,root,self-peer,linux,no-zstd-threads make check
      - name: Tests (root TCP)
        run: RSYNC_TEST_PROFILES=non-asan,root,self-peer,linux,no-zstd-threads ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --use-tcp --daemon-tests-only -j 8
      - name: TLS listing (optional)
        run: ./rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: almalinux-8-bin
          path: |
            rsync
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync

  alpine:
    if: ${{ inputs.alpine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: Alpine 3.24.4 ${{ matrix.arch == 'amd64' && 'AMD64' || 'x86' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            apk_arch: x86_64
            bits: 64
            image: alpine@sha256:0f49f331d9212aff11b932863be4eb01cdf962969aa86dab7d1ee21ac6f5f52b
            profiles: non-asan,self-peer,linux,no-simd,docker-default
          - arch: x86
            platform: linux/386
            apk_arch: x86
            bits: 32
            image: alpine@sha256:55d68c85222dd92297b0f8885354739d89f0dc17fc2f903c49dc1d9c129c3d6a
            profiles: non-asan,self-peer,linux,no-simd,docker-default
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare host
        run: |
          sudo sysctl -w fs.protected_regular=2
          mkdir -p "$RUNNER_TEMP/rsync-alpine-${{ matrix.arch }}"
          docker pull --platform "${{ matrix.platform }}" "${{ matrix.image }}"
          test "$(docker image inspect "${{ matrix.image }}" --format '{{.Os}}/{{.Architecture}}')" = '${{ matrix.platform }}'
      - name: Build and test
        env:
          APK_ARCH: ${{ matrix.apk_arch }}
          BITS: ${{ matrix.bits }}
          PROFILES: ${{ matrix.profiles }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -e APK_ARCH -e BITS -e PROFILES -e RSYNC_TEST_TMP=/dev/shm \
            -v "$PWD:/source:ro" \
            -v "$RUNNER_TEMP/rsync-alpine-${{ matrix.arch }}:/results" \
            "${{ matrix.image }}" sh -euxs <<'ALPINE'
          apk add --no-cache \
            acl acl-dev attr attr-dev autoconf automake bash build-base diffutils file gawk git \
            libidn2-dev linux-headers lz4-dev musl-locales openssl-dev py3-commonmark python3 setpriv \
            xxhash-dev zstd-dev
          test "$(apk --print-arch)" = "$APK_ARCH"

          cp -a /source /work
          cd /work
          git config --global --add safe.directory /work
          ./configure --with-rrsync --enable-iconv --enable-acl-support --enable-xattr-support
          make -j4 check-progs
          file rsync
          file rsync | grep -q "ELF $BITS-bit"
          python3 -c "import struct; assert struct.calcsize('P') * 8 == $BITS"
          ./rsync -VV | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["capabilities"]["file_bits"] == 64'
          python3 testsuite/tools/check-features.py "$PWD/rsync" \
            zstd lz4 xxh128 xxh3 xxh64 iconv IDN ACLs xattrs > /results/features.json

          addgroup -S rsynctest
          addgroup -S rsynctest-extra
          adduser -S -D -h /home/rsynctest -G rsynctest rsynctest
          addgroup rsynctest rsynctest-extra
          mkdir -p /results/root /results/nonroot
          chown rsynctest:rsynctest /results/nonroot

          status=0
          sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,root,$PROFILES" /results/root/pipe -j4 || status=1
          sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,root,$PROFILES,protocol-30" /results/root/protocol-30 --protocol=30 -j4 || status=1
          sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,root,$PROFILES,protocol-29" /results/root/protocol-29 --protocol=29 -j4 || status=1
          sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "root,$PROFILES" /results/root/tcp --use-tcp --daemon-tests-only -j4 || status=1
          su -m rsynctest -s /bin/sh -c '
            export HOME=/home/rsynctest
            status=0
            sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,nonroot,$PROFILES" /results/nonroot/pipe -j4 || status=1
            sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "nonroot,$PROFILES" /results/nonroot/tcp --use-tcp --daemon-tests-only -j4 || status=1
            exit "$status"
          ' || status=1

          mkdir -p /results/bin
          cp rsync rsync-ssl rsync.1 rsync-ssl.1 rsyncd.conf.5 rrsync.1 rrsync /results/bin/
          cp config.log /results/
          chmod -R a+rX /results
          exit "$status"
          ALPINE
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: alpine-3.24.4-${{ matrix.arch }}-bin
          if-no-files-found: error
          path: ${{ runner.temp }}/rsync-alpine-${{ matrix.arch }}/bin
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: alpine-3.24.4-${{ matrix.arch }}-results
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rsync-alpine-${{ matrix.arch }}/config.log
            ${{ runner.temp }}/rsync-alpine-${{ matrix.arch }}/features.json
            ${{ runner.temp }}/rsync-alpine-${{ matrix.arch }}/*/*/receipt.json
            ${{ runner.temp }}/rsync-alpine-${{ matrix.arch }}/*/*/run.log
