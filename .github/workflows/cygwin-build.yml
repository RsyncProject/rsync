name: Test rsync on Cygwin

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/cygwin-build.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/cygwin-build.yml'
  schedule:
    - cron: '42 8 * * *'

jobs:
  test:
    # temporary gate: PR CI runs only for PRs labeled 'run-ci', to save CI
    # minutes; labels need triage access, so fork PRs can't self-enable.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: windows-2022
    name: Test rsync on Cygwin
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: cygwin
      run: choco install -y --no-progress cygwin cyg-get
    - name: prep
      run: |
        cyg-get make autoconf automake gcc-core attr libattr-devel python39 python39-pip libzstd-devel liblz4-devel libssl-devel libxxhash0 libxxhash-devel
        echo "C:/tools/cygwin/bin" >>$Env:GITHUB_PATH
    - name: commonmark
      run: bash -c 'python3 -mpip install --user commonmark'
    - name: configure
      run: bash -c './configure --with-rrsync'
    - name: make
      run: bash -c 'make'
    - name: install
      run: bash -c 'make install'
    - name: info
      run: bash -c '/usr/local/bin/rsync --version'
    - name: check
      # chown-fake / devices-fake / xattrs / xattrs-hlink now RUN on Cygwin
      # (rsyncfns.py drives xattrs via getfattr/setfattr from the `attr`
      # package installed above), verified on a real Cygwin host. The real
      # chown/devices tests still skip (need root/mknod), as do the
      # RESOLVE_BENEATH symlink-race tests.
      run: bash -c 'RSYNC_EXPECT_SKIPPED=acl-symlink-race,acls,acls-default,acls-depth,acls-unpinnable,backup-acl-xattr-cache,backup-dir-symlink-race,basis-xname-traversal,batch-file-symlink,checksum-zero-blocklen,chown,chroot-alt-dest-inner-module,chroot-basis-forge-inner-module,chroot-copy-dest-inner-module,chroot-link-dest-inner-module,chroot-receiver-write-inner-module,chroot-special-inner-module,copy-dest-symlink-readleak,copy-xattrs-symlink-race,daemon-access-ip,daemon-argv-limit,daemon-auth-group,daemon-chroot,daemon-chroot-acl,daemon-chroot-munge-default,daemon-config-symlink,daemon-deny-dns-failopen,daemon-dot-file-force-wipe,daemon-http-proxy,daemon-leaf-type-race-fchmod,daemon-max-alloc-zero,daemon-module-chdir-symlink,daemon-module-options,daemon-module-private-parent,daemon-namecvt-empty-response,daemon-namecvt-newline-token,daemon-proxy-protocol,daemon-refuse-compress-threads-alias,daemon-secrets-file-symlink,daemon-standalone-detach,daemon-symlink-escape-matrix,devices,dir-sgid,early-input-symlink,exclude-implied-trailing-backslash,excludefrom-symlink,fake-super-acl-xattr,fake-super-backup-fifo-regression,files-from-leak,filter-leak,filter-merge-symlink,inband-modname-leak,insecure-links-admin-optout,io-noop-flood-recursion,io-nosend-flood-recursion,io-readargs-argv-nullwrite,ki62-io-error-mask,log-file-symlink,macos-setgid-ordinary-mode-regression,malicious-dot-dir-delete-scope,malicious-dot-file-delete-scope,malicious-server-partial-basis-symlink-overwrite,match-append-empty-nullmap,match-want-i-nolen,msg-io-timeout-overflow,nondaemon-symlink-race,nonroot-restrictive-perms,open-noatime,operator-path-backup-rmdir,operator-path-backup-symlink,operator-path-insecure-links-daemon,partial-protected-regular-retry-linux,partial-protected-regular-retry-policy,password-file-symlink,peer-legacy-implied-delete-scope,protected-regular,proto-cleared-dirflist,proto-cleared-ndx,proto-hlink-flag-oob,proto-hlink-gnum,proto-msg-info-assert,proto-sender-selftest,proto-subflist-freed,proxy-connect-request-too-long,proxy-protocol-trusted-peer,proxy-response-header-too-long,proxy-response-line-too-long,recv-discard-nullderef,recv-generator-acl-leak,rename-mixed-parent-transfer,rrsync-sender-leaf-flip,rrsync-sender-parent-pin,rrsync-symlink,sender-remove-source-root-anchor,simd-checksum,source-change-size-continues,symlink-dest-backupdir,symlink-exclude-xattr,symlink-race-dest,symlink-race-relative-dest,temp-dir-symlink-injection,uidlist-id0-name-leak,variety-symlink-traversal,xattr-wire-cap,xrsync make check'
    - name: check (TCP daemon transport)
      # Second run with daemon tests over a real loopback rsyncd; the default
      # 'make check' above uses the secure stdio-pipe transport.
      run: bash -c './runtests.py --rsync-bin=`pwd`/rsync.exe --use-tcp -j 8'
    - name: ssl file list
      run: bash -c 'PATH="/usr/local/bin:$PATH" rsync-ssl --no-motd download.samba.org::rsyncftp/ || true'
    - name: save artifact
      uses: actions/upload-artifact@v4
      with:
        retention-days: 45
        name: cygwin-bin
        path: |
          rsync.exe
          rsync-ssl
          rsync.1
          rsync-ssl.1
          rsyncd.conf.5
          rrsync.1
          rrsync
