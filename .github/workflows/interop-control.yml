name: Interop control

on:
  workflow_call:
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  isolation:
    name: Isolation control
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate quarantine membership
        run: python3 -B -S .github/scripts/interop-control.py prepare --root "$RUNNER_TEMP/interop"
      - name: Save admission lease
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ github.run_attempt }}-lease
          path: ${{ runner.temp }}/interop/lease.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish quarantine topology
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ github.run_attempt }}-topology
          path: ${{ runner.temp }}/interop/topology.json
          if-no-files-found: error
          retention-days: 7
      - name: Admit isolated cohorts
        run: python3 -B -S .github/scripts/interop-control.py admit --root "$RUNNER_TEMP/interop"
      - name: Publish admission
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ github.run_attempt }}-admission
          path: ${{ runner.temp }}/interop/admission.json
          if-no-files-found: error
          retention-days: 7
      - name: Collect isolation results
        run: python3 -B -S .github/scripts/interop-control.py verify --root "$RUNNER_TEMP/interop"
      - name: Revoke cohort grants
        if: always()
        run: python3 -B -S .github/scripts/interop-control.py revoke --root "$RUNNER_TEMP/interop"
      - name: Publish revocation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ github.run_attempt }}-revocation
          path: ${{ runner.temp }}/interop/revocation.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify revocation and remove devices
        if: always()
        run: python3 -B -S .github/scripts/interop-control.py finish --root "$RUNNER_TEMP/interop"
      - name: Save isolation proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ github.run_attempt }}-result
          path: ${{ runner.temp }}/interop/result.json
          if-no-files-found: error
          retention-days: 7
