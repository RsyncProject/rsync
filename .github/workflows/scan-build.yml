name: rsync scan-build (clang analyzer)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/scan-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/scan-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pinned analyser and runner form the deterministic gate
  gate-clang18:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: scan-build gate (clang-18, pinned)
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: prep
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 clang-tools-18 acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev libpopt-dev openssl
    - name: configure (under scan-build)
      run: scan-build-18 ./configure --with-rrsync --disable-md2man
    - name: scan-build (gating)
      run: |
        set -o pipefail
        status=0
        scan-build-18 --status-bugs -o "$PWD/scan-report" make check-progs -j"$(nproc)" 2>&1 | tee scan-build.out || status=$?
        echo '## scan-build gate (clang-18)' >>"$GITHUB_STEP_SUMMARY"
        grep -E 'scan-build: .* bugs? found|scan-build: No bugs found' scan-build.out >>"$GITHUB_STEP_SUMMARY" || true
        exit $status
    - name: upload report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: scan-build-report-clang18
        path: scan-report
        if-no-files-found: ignore

  # The moving analyser is informational until its checker set is pinned
  informational-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: scan-build (latest clang, informational)
    continue-on-error: true
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: prep
      run: |
        sudo apt-get update
        sudo apt-get install -y clang clang-tools acl libacl1-dev attr libattr1-dev liblz4-dev libidn2-dev libzstd-dev libxxhash-dev libpopt-dev openssl
    - name: configure (under scan-build)
      run: scan-build ./configure --with-rrsync --disable-md2man
    - name: scan-build (informational)
      run: |
        scan-build -o "$PWD/scan-report" make check-progs -j"$(nproc)" 2>&1 | tee scan-build.out
        echo '## scan-build informational (latest clang)' >>"$GITHUB_STEP_SUMMARY"
        grep -E 'scan-build: .* bugs? found|scan-build: No bugs found' scan-build.out >>"$GITHUB_STEP_SUMMARY" || true
    - name: upload report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: scan-build-report-latest
        path: scan-report
        if-no-files-found: ignore
