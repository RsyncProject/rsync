name: Archive

on:
  workflow_call:
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  archive:
    name: Ubuntu 24.04 X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gawk fakeroot acl attr libacl1-dev libattr1-dev libxxhash-dev libzstd-dev liblz4-dev libidn2-dev libpopt-dev libssl-dev python3-cmarkgfm openssl
      - name: Prepare source
        run: ./prepare-source
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        run: |
          make -j2
          make gen
      - name: Create archive
        run: python3 -B -S .github/scripts/archive.py create --archive test-results/source.tar.gz
      - name: Qualify archive
        run: python3 -B -S .github/scripts/archive.py test --archive test-results/source.tar.gz --output test-results/archive
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-archive-results
          retention-days: 45
          if-no-files-found: error
          path: test-results/
