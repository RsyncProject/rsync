name: macOS

on:
  workflow_call:
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    name: Test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          brew install automake openssl xxhash zstd lz4 libidn2
          pip3 install --user --break-system-packages commonmark
          echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"
      - name: Configure
        run: |
          BREW_PREFIX=$(brew --prefix)
          OPENSSL_PREFIX=$(brew --prefix openssl)
          CPPFLAGS="-I${BREW_PREFIX}/include -I${OPENSSL_PREFIX}/include" \
          LDFLAGS="-L${BREW_PREFIX}/lib -L${OPENSSL_PREFIX}/lib" \
          ./configure --with-rrsync
      - name: Build
        run: make
      - name: Install
        run: sudo make install
      - name: Version
        run: rsync --version
      - name: Tests (pipe)
        run: sudo RSYNC_TEST_PROFILES=pipe,non-asan,root,self-peer,macos make check
      - name: Tests (TCP)
        run: sudo RSYNC_TEST_PROFILES=non-asan,root,self-peer,macos ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --use-tcp --daemon-tests-only -j 8
      - name: TLS listing (optional)
        run: rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 45
          name: macos-bin
          path: |
            rsync
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync
