name: LTS CI

on:
  push:
    branches: [lts/3.2.7]
  pull_request:
    branches: [lts/3.2.7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  linux:
    name: Ubuntu ${{ matrix.release }} X86-64
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '22.04'
            runner: ubuntu-22.04
          - release: '24.04'
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr libacl1-dev libattr1-dev liblz4-dev libzstd-dev libxxhash-dev openssl python3-cmarkgfm
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        run: make -j2
      - name: Tests
        run: make check
      - name: Protocol 29
        if: matrix.release == '24.04'
        run: make check29
      - name: Protocol 30
        if: matrix.release == '24.04'
        run: make check30
      - name: Root tests
        if: matrix.release == '24.04'
        run: sudo make check
      - name: Manuals
        if: matrix.release == '24.04'
        run: make man
      - name: Installed form
        if: matrix.release == '24.04'
        run: |
          destination=$(mktemp -d)
          make DESTDIR="$destination" install
          "$destination/usr/local/bin/rsync" --version
          python3 "$destination/usr/local/bin/rrsync" -h >/dev/null
          test -s "$destination/usr/local/share/man/man1/rrsync.1"

  almalinux:
    name: AlmaLinux 8 X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
    steps:
      - name: Install Git
        run: dnf -y install git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          dnf -y install epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf -y install gcc gcc-c++ make autoconf automake m4 diffutils \
            python39 attr libattr-devel acl libacl-devel openssl openssl-devel \
            lz4 lz4-devel zstd libzstd-devel xxhash xxhash-devel
          alternatives --set python3 /usr/bin/python3.9
          groupadd rsynctest-extra
          useradd -m -G rsynctest-extra rsynctest
      - name: Configure
        run: ./configure --disable-md2man --with-rrsync
      - name: Build
        run: make -j2
      - name: Tests
        run: make check

  alpine_x86:
    name: Alpine 3.24.4 X86-32
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Alpine
        run: |
          docker run --rm --platform linux/386 \
            -v "$PWD:/source:ro" \
            alpine@sha256:55d68c85222dd92297b0f8885354739d89f0dc17fc2f903c49dc1d9c129c3d6a \
            sh -ec '
              apk add --no-cache acl acl-dev attr attr-dev autoconf automake \
                build-base diffutils libidn2-dev linux-headers lz4-dev \
                openssl-dev popt-dev python3 xxhash-dev zstd-dev
              addgroup -S rsynctest-extra
              adduser -D rsynctest
              addgroup rsynctest rsynctest-extra
              cp -a /source /work
              cd /work
              ./configure --disable-md2man --with-rrsync
              make -j2
              make check
            '

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: ARM64
          - runner: macos-26-intel
            arch: X86-64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: brew install automake openssl xxhash zstd lz4
      - name: Configure
        run: |
          prefix=$(brew --prefix)
          openssl_prefix=$(brew --prefix openssl)
          CPPFLAGS="-I${prefix}/include -I${openssl_prefix}/include" \
          LDFLAGS="-L${prefix}/lib -L${openssl_prefix}/lib" \
            ./configure --disable-md2man --with-included-zlib=no --with-rrsync \
              --enable-iconv --enable-acl-support --enable-xattr-support
      - name: Build
        run: make -j2
      - name: Tests
        run: make check

  cygwin:
    name: Cygwin X86-64
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Cygwin
        run: choco install -y --no-progress cygwin cyg-get
      - name: Install dependencies
        run: |
          cyg-get make autoconf automake gcc-core attr libattr-devel python39 libzstd-devel liblz4-devel libssl-devel libxxhash0 libxxhash-devel
          'C:\tools\cygwin\bin' >>$Env:GITHUB_PATH
      - name: Configure
        run: bash -c './configure --disable-md2man --with-rrsync'
      - name: Build
        run: bash -c 'make -j2'
      - name: Tests
        run: bash -c 'make check'
      - name: Restore Git
        if: always()
        run: |
          $directory = 'C:\Program Files\Git\cmd'
          if (-not (Test-Path -LiteralPath (Join-Path $directory 'git.exe'))) {
            throw 'Runner Git is unavailable'
          }
          $directory >>$Env:GITHUB_PATH

  freebsd:
    name: FreeBSD 15.1 X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare VM host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86 qemu-utils
      - name: Build and test
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          cache-after-prepare: true
          prepare: pkg install -y autotools gmake libiconv liblz4 python3 xxhash zstd
          run: |
            CPPFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib \
              ./configure --disable-md2man --enable-iconv --enable-acl-support --enable-xattr-support --with-rrsync
            gmake -j2
            gmake check

  netbsd:
    name: NetBSD 11.1 X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare VM host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86 qemu-utils
      - name: Build and test
        uses: vmactions/netbsd-vm@5957cf330aef2e6ddc63c604364c99ce2e02b91d # v1.5.3
        with:
          release: '11.1'
          sync: tar
          cache-after-prepare: true
          prepare: |
            export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r)/All"
            PATH=/usr/sbin:$PATH pkg_add -U autoconf automake gmake python312
            ln -sf /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
          run: |
            ./configure --disable-md2man --disable-xxhash --disable-zstd --disable-lz4 --with-rrsync
            gmake -j2
            gmake check

  openbsd:
    name: OpenBSD 8.0 X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare VM host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86 qemu-utils
      - name: Build and test
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: '8.0'
          cache-after-prepare: true
          prepare: pkg_add -I autoconf%2.71 automake%1.16 gmake libiconv lz4 xxhash zstd
          run: |
            AUTOCONF_VERSION=2.71 AUTOMAKE_VERSION=1.16 \
            CPPFLAGS="-I/usr/local/include -DXXH_INLINE_ALL=1" \
            LDFLAGS=-L/usr/local/lib ac_cv_search_XXH64_createState='' \
              ./configure --disable-md2man --enable-iconv --with-rrsync
            gmake -j2
            gmake check

  solaris:
    name: Solaris 11.4 X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare VM host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86 qemu-utils
      - name: Build and test
        uses: vmactions/solaris-vm@87d3c436511cef802cd1637f86f73b1a97715c8c # v1.4.1
        with:
          release: '11.4'
          cache-after-prepare: true
          prepare: pkg install autoconf automake gcc gnu-make gnu-m4 pkg://solaris/runtime/python-35
          run: |
            ./configure --disable-md2man --disable-xxhash --with-rrsync
            gmake -j2
            gmake check

  diagnostics:
    name: Diagnostics / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fortify
            cflags: -O2 -D_FORTIFY_SOURCE=3 -Werror=stringop-overflow
            ldflags: ''
            configure: ''
          - name: ASan and UBSan
            cflags: -O1 -g -fsanitize=address,undefined -fno-sanitize=alignment -fno-sanitize-recover=undefined -fno-omit-frame-pointer
            ldflags: -fsanitize=address,undefined
            configure: ''
          - name: AVX2 assembly
            cflags: -O2
            ldflags: ''
            configure: --enable-roll-asm
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:verify_asan_link_order=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr libacl1-dev libattr1-dev liblz4-dev libzstd-dev libxxhash-dev openssl
      - name: Check AVX2
        if: matrix.name == 'AVX2 assembly'
        run: grep -qw avx2 /proc/cpuinfo
      - name: Configure
        env:
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: ./configure --disable-md2man --with-rrsync ${{ matrix.configure }}
      - name: Build
        run: make -j2
      - name: Tests
        run: make check

  mixed_versions:
    name: Mixed versions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr libacl1-dev libattr1-dev libidn2-dev liblz4-dev libpopt-dev libzstd-dev libxxhash-dev openssl
      - name: Build LTS
        run: |
          ./configure --disable-md2man --with-rrsync
          make -j2
      - name: Test peers
        run: |
          for version in 3.2.7 3.5.2; do
            peer="$RUNNER_TEMP/rsync-$version"
            git clone --shared --quiet "$PWD" "$peer"
            git -C "$peer" checkout --quiet --detach "v$version"
            (
              cd "$peer"
              ./configure --disable-md2man
              make -j2
            )
            work=`mktemp -d "$RUNNER_TEMP/mixed-$version.XXXXXX"`
            rmdir "$work"
            ./testsuite/mixed-version.sh "$PWD/rsync" "$peer/rsync" "$work"
          done
