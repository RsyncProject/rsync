name: Other

on:
  workflow_call:
    inputs:
      cygwin:
        required: true
        type: boolean
      solaris:
        required: true
        type: boolean
      versions:
        required: true
        type: boolean
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}
      inputs:
        description: Job selections
        value: ${{ toJSON(inputs) }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  cygwin:
    if: ${{ inputs.cygwin }}
    runs-on: windows-2022
    timeout-minutes: 60
    name: Cygwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Cygwin
        shell: pwsh
        run: |
          $setup = Join-Path $Env:RUNNER_TEMP 'setup-x86_64.exe'
          $sums = Join-Path $Env:RUNNER_TEMP 'cygwin-sha512.sum'
          $packages = 'make,autoconf,automake,gcc-core,attr,libattr-devel,python39,python39-pip,libzstd-devel,liblz4-devel,libssl-devel,libxxhash0,libxxhash-devel,libidn2-devel'

          Invoke-WebRequest https://cygwin.com/setup-x86_64.exe -OutFile $setup
          Invoke-WebRequest https://cygwin.com/sha512.sum -OutFile $sums

          $sum = Select-String -LiteralPath $sums -Pattern '^[0-9a-fA-F]{128}\s+\*?setup-x86_64\.exe$' | Select-Object -First 1
          if (-not $sum) {
            throw 'setup-x86_64.exe is missing from Cygwin sha512.sum'
          }
          $expected = ($sum.Line -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA512).Hash
          if ($actual -ine $expected) {
            throw 'Cygwin setup SHA-512 mismatch'
          }

          $arguments = @(
            '--quiet-mode',
            '--no-desktop',
            '--no-startmenu',
            '--no-shortcuts',
            '--root', 'C:\tools\cygwin',
            '--local-package-dir', (Join-Path $Env:RUNNER_TEMP 'cygwin-packages'),
            '--site', 'https://mirrors.kernel.org/sourceware/cygwin/',
            '--packages', $packages
          )
          $install = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($install.ExitCode -ne 0) {
            exit $install.ExitCode
          }

          $bash = 'C:\tools\cygwin\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) {
            throw 'Cygwin setup did not install bash'
          }
          & $bash -lc 'command -v make aclocal gcc python3 >/dev/null'
          if ($LASTEXITCODE -ne 0) {
            throw 'Cygwin setup did not install all required build tools'
          }

          echo 'C:/tools/cygwin/bin' >>$Env:GITHUB_PATH
      - name: Install CommonMark
        shell: pwsh
        run: bash -c 'python3 -mpip install --user commonmark'
      - name: Platform
        shell: pwsh
        run: bash -c 'python3 -S .github/scripts/check-platform.py cygwin --arch x86_64'
      - name: Configure
        shell: pwsh
        run: bash -c './configure --with-rrsync'
      - name: Build
        id: build
        shell: pwsh
        run: bash -c 'make check-progs'
      - name: Install
        shell: pwsh
        run: bash -c 'make install'
      - name: Version
        shell: pwsh
        run: bash -c '/usr/local/bin/rsync --version'
      - name: Tests (non-root pipe)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: bash -c 'python3 -S testsuite/tools/check.py "$PWD" "$PWD/rsync.exe" pipe,non-asan,nonroot,self-peer,cygwin "$PWD/test-results/nonroot/pipe" -j8'
      - name: Tests (non-root TCP)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: bash -c 'python3 -S testsuite/tools/check.py "$PWD" "$PWD/rsync.exe" non-asan,nonroot,self-peer,cygwin "$PWD/test-results/nonroot/tcp" --use-tcp --daemon-tests-only -j8'
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: cygwin-bin
          path: |
            rsync.exe
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cygwin-results
          if-no-files-found: error
          path: |
            test-results/*/*/run.log
            test-results/*/*/receipt.json

  solaris:
    if: ${{ inputs.solaris }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: Solaris
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare VM host
        timeout-minutes: 10
        run: |
          set -- qemu-utils qemu-system-x86 ovmf
          sudo apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends "$@" || {
            sudo apt-get update -q
            sudo apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends "$@"
          }
      - name: Run VM and collect results
        id: test
        uses: vmactions/solaris-vm@87d3c436511cef802cd1637f86f73b1a97715c8c # v1.4.1
        with:
          cache-after-prepare: true
          prepare: |
            pkg install bash automake gnu-m4 pkg://solaris/runtime/python-35 autoconf gcc git
          run: python3 -S .github/scripts/guest.py solaris
      - name: Verify guest results
        run: python3 -S .github/scripts/guest.py check
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: solaris-bin
          path: |
            rsync
            rsync-ssl
            rsync.1
            rsync-ssl.1
            rsyncd.conf.5
            rrsync.1
            rrsync
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: solaris-results
          if-no-files-found: error
          path: |
            config.log
            test-results/status
            test-results/*/*/receipt.json
            test-results/*/*/run.log

  versions:
    name: Version mix
    if: ${{ inputs.versions }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev python3-cmarkgfm openssl
          echo "/usr/local/bin" >>"$GITHUB_PATH"
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        id: build
        run: make check-progs
      - name: Version
        run: ./rsync --version
      - name: Validate profiles
        run: ./testsuite/runtests.py profile --rsync-bin="$PWD/rsync"
      - name: Tests (non-root pipe and TCP)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -S .github/scripts/versions.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-mix-receipts
          path: test-results/version-mix

