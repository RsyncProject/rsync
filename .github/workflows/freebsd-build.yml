name: Test rsync on FreeBSD

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/freebsd-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/freebsd-build.yml'
  schedule:
    - cron: '42 8 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test rsync on FreeBSD
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Test in FreeBSD VM
      id: test
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg install -y bash autotools m4 devel/xxhash zstd liblz4 python3 archivers/liblz4 git
        run: |
          freebsd-version
          ./configure --with-rrsync \
            -disable-zstd --disable-md2man --disable-xxhash --disable-lz4 --disable-idn \
            --enable-roll-simd --enable-roll-asm --enable-md5-asm
          make
          ./rsync --version
          make check
          ./runtests.py --rsync-bin=`pwd`/rsync --use-tcp -j 8
          # Non-root, targeted: without setpriv the root runs skip the
          # search-only tests. Run them as uid 65534 from a copy under /tmp,
          # which that uid can traverse, without root's PATH (/root/bin).
          rm -rf /tmp/rsync-nonroot && cp -Rp . /tmp/rsync-nonroot
          rm -rf /tmp/rsync-nonroot/testtmp && chown -R 65534:65534 /tmp/rsync-nonroot
          (cd /tmp/rsync-nonroot && env HOME=/tmp/rsync-nonroot PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin python3 -c 'import os, sys; os.setgroups([]); os.setgid(65534); os.setuid(65534); os.execv(sys.executable, [sys.executable] + sys.argv[1:])' \
            runtests.py --rsync-bin=/tmp/rsync-nonroot/rsync search-only-destination search-only-held-dirfd)
          ./rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
    - name: save artifact
      uses: actions/upload-artifact@v4
      with:
        retention-days: 45
        name: freebsd-bin
        path: |
          rsync
          rsync-ssl
          rsync.1
          rsync-ssl.1
          rsyncd.conf.5
          rrsync.1
          rrsync
