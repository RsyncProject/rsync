name: Test rsync on AlmaLinux 8

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/almalinux-8-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/almalinux-8-build.yml'
  schedule:
    - cron: '42 8 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: almalinux:8
    name: Test rsync on AlmaLinux 8
    steps:
    - name: install git
      run: dnf -y install git
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: prep
      run: |
        # RHEL 8's default Python is too old for the test runner
        dnf -y install epel-release
        dnf config-manager --set-enabled powertools
        dnf -y install gcc gcc-c++ make autoconf automake m4 \
            python39 python39-pip diffutils \
            openssl openssl-devel \
            attr libattr-devel acl libacl-devel \
            zstd libzstd-devel \
            lz4 lz4-devel \
            xxhash xxhash-devel \
            libidn2 libidn2-devel
        alternatives --set python3 /usr/bin/python3.9
        pip3 install commonmark
    - name: configure
      run: ./configure --with-rrsync
    - name: make
      run: make
    - name: info
      run: ./rsync --version
    - name: check
      run: RSYNC_TEST_PROFILES=pipe,non-asan,root,self-peer,linux,no-zstd-threads make check
    - name: check (TCP daemon transport)
      run: RSYNC_TEST_PROFILES=non-asan,root,self-peer,linux,no-zstd-threads ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --use-tcp --daemon-tests-only -j 8
    - name: ssl file list
      run: ./rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
    - name: save artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        retention-days: 45
        name: almalinux-8-bin
        path: |
          rsync
          rsync-ssl
          rsync.1
          rsync-ssl.1
          rsyncd.conf.5
          rrsync.1
          rrsync
