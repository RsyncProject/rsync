name: Test rsync on Ubuntu

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/ubuntu-build.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/ubuntu-build.yml'
  schedule:
    - cron: '42 8 * * 1'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: Test rsync on Ubuntu latest
            artifact: ubuntu-bin
            nonroot: true
            install_smoke: true
            profiles: non-asan,root,self-peer,linux
          - runner: ubuntu-22.04
            name: Test rsync on Ubuntu 22.04
            artifact: ubuntu-22.04-bin
            nonroot: false
            install_smoke: false
            profiles: non-asan,root,self-peer,linux,no-zstd-threads
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    name: ${{ matrix.name }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: prep
      run: |
        sudo apt-get update
        sudo apt-get install acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev python3-cmarkgfm openssl
        echo "/usr/local/bin" >>"$GITHUB_PATH"
        mkdir -p "$RUNNER_TEMP/rsync-checks"
    - name: configure
      run: ./configure --with-rrsync
    - name: make
      run: make check-progs
    - name: install/uninstall DESTDIR smoke test
      if: matrix.install_smoke
      run: |
        set -e
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        make install-all DESTDIR="$tmp"

        for path in \
          /usr/local/bin/rsync \
          /usr/local/bin/rsync-ssl \
          /usr/local/bin/rrsync \
          /usr/local/share/man/man1/rsync.1 \
          /usr/local/share/man/man1/rsync-ssl.1 \
          /usr/local/share/man/man1/rrsync.1 \
          /usr/local/share/man/man5/rsyncd.conf.5 \
          /etc/stunnel/rsyncd.conf
        do
          test -e "$tmp$path"
        done

        make uninstall-all DESTDIR="$tmp"

        leftover="$(find "$tmp" -type f -print)"
        if [ -n "$leftover" ]; then
          printf '%s\n' "$leftover"
          exit 1
        fi
    - name: install
      run: sudo make install
    - name: info
      run: ./rsync --version
    - name: check
      run: sudo sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,${{ matrix.profiles }}" "$RUNNER_TEMP/rsync-checks/root-pipe" -j8
    - name: check30
      run: sudo sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,${{ matrix.profiles }},protocol-30" "$RUNNER_TEMP/rsync-checks/root-protocol-30" --protocol=30 -j8
    - name: check29
      run: sudo sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,${{ matrix.profiles }},protocol-29" "$RUNNER_TEMP/rsync-checks/root-protocol-29" --protocol=29 -j8
    - name: check (TCP daemon transport)
      run: sudo sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "${{ matrix.profiles }}" "$RUNNER_TEMP/rsync-checks/root-tcp" --use-tcp --daemon-tests-only -j8
    - name: check (non-root, targeted)
      if: matrix.nonroot
      run: sh testsuite/tools/check.sh "$PWD" "$PWD/rsync" "pipe,non-asan,nonroot,self-peer,linux" "$RUNNER_TEMP/rsync-checks/nonroot-targeted" daemon-namecvt-empty-response ownership-depth daemon-basics
    - name: ssl file list
      run: rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
    - name: save artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        retention-days: 45
        name: ${{ matrix.artifact }}
        if-no-files-found: error
        path: |
          rsync
          rsync-ssl
          rsync.1
          rsync-ssl.1
          rsyncd.conf.5
          rrsync.1
          rrsync
    - name: save test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        retention-days: 45
        name: ${{ matrix.artifact }}-results
        if-no-files-found: error
        path: |
          config.log
          ${{ runner.temp }}/rsync-checks/*/receipt.json
          ${{ runner.temp }}/rsync-checks/*/run.log
