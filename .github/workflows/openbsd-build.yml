name: Test rsync on OpenBSD

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/openbsd-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/openbsd-build.yml'
  schedule:
    - cron: '42 8 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Test rsync on OpenBSD
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: prepare VM host
      timeout-minutes: 10
      run: |
        packages=(qemu-utils qemu-system-x86 ovmf)
        sudo apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends "${packages[@]}" || {
          sudo apt-get update -q
          sudo apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends "${packages[@]}"
        }
    - name: Test in OpenBSD VM
      id: test
      uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
      with:
        cache-after-prepare: true
        prepare: |
          pkg_add -I bash autoconf%2.71 automake%1.16
        run: |
          uname -a
          export AUTOCONF_VERSION=2.71
          export AUTOMAKE_VERSION=1.16
          ./configure --with-rrsync --disable-zstd --disable-md2man --disable-xxhash --disable-lz4 --disable-idn
          make check-progs
          ./rsync --version
          # The flipper (symlink-race) tests are excluded on OpenBSD, as on the
          # fleet's OpenBSD box: this kernel has a connect()-under-rename-load
          # lost-wakeup and an FFS rename-storm corruption that hang them to
          # the 300s timeout for non-rsync reasons (see
          # dev-notes/openbsd-connect-lost-wakeup-report.txt); the protections
          # they exercise are verified on the Linux/BSD boxes.
          export RSYNC_EXCLUDE=acl-symlink-race,sender-readlink-atfd,sender-remove-source-secure
          RSYNC_TEST_PROFILES=pipe,non-asan,root,self-peer,openbsd,no-idn,no-xxhash,no-zstd-threads ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --receipt=test-results/openbsd-pipe.json -j 8
          # The --use-tcp daemon tests run at -j2 here (vs -j8 elsewhere): this
          # job runs inside a nested VM, and at -j8 the many concurrent loopback
          # daemons occasionally lose a connection-handshake timing race under
          # that resource pressure, hanging one test to the 300s timeout. It is
          # an environment artifact, not an rsync bug (the handshake is
          # deadlock-free and unreproducible elsewhere, even pinned to 1 CPU at
          # -j8); -j2 keeps the VM from over-subscribing. The pipe pass above
          # stays at the default parallelism.
          RSYNC_TEST_PROFILES=non-asan,root,self-peer,openbsd,no-idn,no-xxhash,no-zstd-threads ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --use-tcp --receipt=test-results/openbsd-tcp.json -j 2
          ./rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
    - name: save artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        retention-days: 45
        name: openbsd-bin
        path: |
          rsync
          rsync-ssl
          rsync.1
          rsync-ssl.1
          rsyncd.conf.5
          rrsync.1
          rrsync
          test-results/*.json
