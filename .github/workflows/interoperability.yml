name: Network controller
run-name: Network controller

on:
  workflow_run:
    workflows: [CI]
    types: [in_progress]

permissions:
  contents: read
  actions: read

concurrency:
  group: network-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  controller:
    name: Admission and cleanup
    if: ${{ github.event.workflow_run.event != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate CI identity
        id: source
        run: python3 -B -S .github/scripts/interop-broker.py metadata --root "$RUNNER_TEMP/interoperability"
      - name: Upload controller context
        if: ${{ steps.source.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interoperability-context-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interoperability/context.json
          if-no-files-found: error
          retention-days: 7
      - name: Issue single-use enrolment keys
        if: ${{ steps.source.outputs.enabled == 'true' }}
        run: python3 -B -S .github/scripts/interop-broker.py broker --root "$RUNNER_TEMP/interoperability"
      - name: Upload encrypted enrolment
        if: ${{ steps.source.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interoperability-${{ steps.source.outputs.attempt }}-enrol
          path: ${{ runner.temp }}/interoperability/enrol.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate endpoint membership
        if: ${{ steps.source.outputs.enabled == 'true' }}
        run: python3 -B -S .github/scripts/interop-broker.py prepare --root "$RUNNER_TEMP/interoperability"
      - name: Attest admission lease
        if: ${{ steps.source.outputs.enabled == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/interoperability/lease.json
          create-storage-record: false
      - name: Upload admission lease
        if: ${{ always() && steps.source.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interoperability-lease-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interoperability/lease.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload topology
        if: ${{ steps.source.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interoperability-${{ steps.source.outputs.attempt }}-topology
          path: ${{ runner.temp }}/interoperability/topology.json
          if-no-files-found: error
          retention-days: 7
      - name: Admit the seven endpoints
        if: ${{ steps.source.outputs.enabled == 'true' }}
        run: python3 -B -S .github/scripts/interop-broker.py admit --root "$RUNNER_TEMP/interoperability"
      - name: Upload admission
        if: ${{ steps.source.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interoperability-${{ steps.source.outputs.attempt }}-admission
          path: ${{ runner.temp }}/interoperability/admission.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify directed transfer results
        continue-on-error: true
        if: ${{ steps.source.outputs.enabled == 'true' }}
        run: python3 -B -S .github/scripts/interop-broker.py verify --root "$RUNNER_TEMP/interoperability"
      - name: Revoke access
        continue-on-error: true
        if: ${{ always() && steps.source.outputs.enabled == 'true' }}
        run: python3 -B -S .github/scripts/interop-broker.py revoke --root "$RUNNER_TEMP/interoperability"
      - name: Upload revocation
        continue-on-error: true
        if: ${{ always() && steps.source.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interoperability-${{ steps.source.outputs.attempt }}-revocation
          path: ${{ runner.temp }}/interoperability/revocation.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify revocation and remove devices
        if: ${{ always() && steps.source.outputs.enabled == 'true' }}
        run: python3 -B -S .github/scripts/interop-broker.py finish --root "$RUNNER_TEMP/interoperability"
      - name: Upload cleanup result
        continue-on-error: true
        if: ${{ always() && steps.source.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interoperability-${{ steps.source.outputs.attempt }}-result
          path: ${{ runner.temp }}/interoperability/result.json
          if-no-files-found: error
          retention-days: 7
