name: Versions

on:
  workflow_call:
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  mix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Primary
            role: primary
          - name: Secondary
            role: secondary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev python3-cmarkgfm openssl
          echo "/usr/local/bin" >>"$GITHUB_PATH"
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        id: build
        run: make check-progs
      - name: Version
        run: ./rsync --version
      - name: Validate profiles
        run: ./testsuite/runtests.py profile --rsync-bin="$PWD/rsync"
      - name: Tests (non-root pipe and TCP)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -S .github/scripts/versions.py --role "${{ matrix.role }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-mix-${{ matrix.role }}-receipts
          path: test-results/version-mix
