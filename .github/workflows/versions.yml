name: Versions

on:
  workflow_call:
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

jobs:
  version_mix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Version mix
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev python3-cmarkgfm openssl
          echo "/usr/local/bin" >>"$GITHUB_PATH"
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        run: make check-progs
      - name: Version
        run: ./rsync --version | head -1
      - name: Validate profiles
        run: ./testsuite/runtests.py profile --rsync-bin="$PWD/rsync"
      - name: Tests (pipe and TCP)
        run: |
          mkdir -p test-results/version-mix
          rc=0
          for peer in old_versions/rsync_*; do
            chmod +x "$peer"
            name=$(basename "$peer")
            profile="peer-${name#rsync_}"
            for transport in pipe tcp; do
              tcp=()
              [ "$transport" = tcp ] && tcp=(--use-tcp --daemon-tests-only)
              echo "::group::$name ($transport): $("$peer" --version | head -1)"
              if ! ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --rsync-bin2="$PWD/$peer" \
                    --profiles="linux,pre-3.4.3,$profile" --receipt="test-results/version-mix/$name-$transport.json" \
                    "${tcp[@]}" -j 8; then
                echo "::error::version-mix failed: $name ($transport)"
                rc=1
              fi
              echo "::endgroup::"
            done
          done
          exit $rc
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: version-mix-receipts
          path: test-results/version-mix
