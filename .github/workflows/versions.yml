name: Versions

on:
  workflow_call:
    outputs:
      jobs:
        description: Job results
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  mix:
    name: Archived peers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev python3-cmarkgfm openssl
          echo "/usr/local/bin" >>"$GITHUB_PATH"
      - name: Configure
        run: ./configure --with-rrsync
      - name: Build
        id: build
        run: make check-progs
      - name: Version
        run: ./rsync --version
      - name: Validate profiles
        run: python3 -S testsuite/runtests.py profile --rsync-bin="$PWD/rsync"
      - name: Tests (archived primary)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -S .github/scripts/versions.py --role primary --output test-results/version-mix/primary
      - name: Upload primary receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: version-mix-primary-receipts
          if-no-files-found: error
          path: test-results/version-mix/primary
      - name: Tests (archived secondary)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -S .github/scripts/versions.py --role secondary --output test-results/version-mix/secondary
      - name: Upload secondary receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 45
          name: version-mix-secondary-receipts
          if-no-files-found: error
          path: test-results/version-mix/secondary
