name: Test rsync version mixing on Ubuntu

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Run the current suite against every retained peer over pipe and TCP transports.
# Test metadata selects applicable coverage while peer profiles record deviations.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/ubuntu-version-mix.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/ubuntu-version-mix.yml'
  schedule:
    - cron: '52 8 * * 1'

permissions:
  contents: read

jobs:
  version-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: rsync version-mix
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: prep
      run: |
        sudo apt-get update
        sudo apt-get install acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev python3-cmarkgfm openssl
        echo "/usr/local/bin" >>"$GITHUB_PATH"
    - name: configure
      run: ./configure --with-rrsync
    - name: make
      # Build rsync and the helpers used by direct runner invocations.
      run: make check-progs
    - name: info
      run: ./rsync --version | head -1
    - name: validate profiles
      run: ./testsuite/runtests.py profile --rsync-bin="$PWD/rsync"
    - name: version mixing (all peers, pipe + TCP transports)
      run: |
        mkdir -p test-results/version-mix
        rc=0
        for peer in old_versions/rsync_*; do
          chmod +x "$peer"
          name=$(basename "$peer")
          profile="peer-${name#rsync_}"
          for transport in pipe tcp; do
            tcp=()
            [ "$transport" = tcp ] && tcp=(--use-tcp)
            echo "::group::$name ($transport): $("$peer" --version | head -1)"
            if ! ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --rsync-bin2="$PWD/$peer" \
                  --profiles="linux,$profile" --receipt="test-results/version-mix/$name-$transport.json" \
                  "${tcp[@]}" -j 8; then
              echo "::error::version-mix failed: $name ($transport)"
              rc=1
            fi
            echo "::endgroup::"
          done
        done
        exit $rc
    - name: upload receipts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: version-mix-receipts
        path: test-results/version-mix
