name: Test rsync on Debian 10 Buster

# This workflow also ensures compatibility with Python 3.7

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/debian-10-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/debian-10-build.yml'
  schedule:
    - cron: '42 8 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: debian:buster
    name: Test rsync on Debian 10 Buster
    steps:
    - name: point apt sources to archive.debian.org
      run: sed -i 's/deb\.debian\.org/archive.debian.org/' /etc/apt/sources.list
    - name: populate apt cache
      run: apt-get update
    - name: install git
      # actions/checkout needs git in the container before the checkout step.
      run: apt-get -y install git
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: prep
      run: |
        apt-get -y install \
          build-essential autoconf automake autotools-dev m4 \
          acl libacl1-dev attr libattr1-dev \
          libidn2-dev liblz4-dev libpopt-dev libssl-dev zlib1g-dev \
          python3:native python3-cmarkgfm:native
    - name: configure
      # Don't use bundled zlib
      # Disable md5-asm optimization: we link against openssl so rsync ends up
      # using that library's implementation of the hash
      # Disable xxhash and zstd: the system libs are too old for the build
      run: ./configure --with-rrsync --with-included-zlib=no --disable-md5-asm --disable-xxhash --disable-zstd
    - name: make
      run: make
    - name: install
      run: make install
    - name: info
      run: rsync --version
    - name: check
      run: RSYNC_EXPECT_SKIPPED=@testsuite/skiplist/common.txt,@testsuite/skiplist/linux.txt make check
    - name: save artifact
      uses: actions/upload-artifact@v4
      with:
        retention-days: 45
        name: debian-10-bin
        path: |
          rsync
          rsync-ssl
          rsync.1
          rsync-ssl.1
          rsyncd.conf.5
          rrsync.1
          rrsync
