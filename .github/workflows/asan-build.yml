name: rsync ASan+UBSan (clang)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/asan-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/asan-build.yml'
  schedule:
    - cron: '42 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: rsync ASan+UBSan (clang)
    env:
      # Process-exit leaks are intentional; memory errors remain fatal
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: prep
      run: |
        sudo apt-get update
        sudo apt-get install -y clang acl libacl1-dev attr libattr1-dev liblz4-dev libzstd-dev libxxhash-dev libidn2-dev openssl
        echo "/usr/local/bin" >>"$GITHUB_PATH"
    - name: configure
      # Exercise release behaviour with assertions disabled
      run: |
        CC=clang \
        CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g -O1 -DNDEBUG" \
        LDFLAGS="-fsanitize=address,undefined" \
        ./configure --with-rrsync --disable-md2man
    - name: make
      run: make check-progs
    - name: info
      run: ./rsync --version
    - name: check (stdio-pipe transport)
      run: RSYNC_TEST_PROFILES=pipe,nonroot,self-peer,linux ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --receipt=test-results/asan-pipe.json -j8
    - name: check (TCP daemon transport)
      run: RSYNC_TEST_PROFILES=nonroot,self-peer,linux ./testsuite/runtests.py --rsync-bin="$PWD/rsync" --use-tcp --daemon-tests-only --receipt=test-results/asan-tcp.json -j8
    - name: upload receipts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        retention-days: 45
        name: asan-receipts
        path: test-results/*.json
