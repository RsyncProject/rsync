---
exclude:
  (?x)^(
  old_versions/|
  popt/|
  zlib/|
  rsync-web/|
  params\.c$|
  config\.guess$|config\.status$|config\.sub$|
  configure$|configure\.sh$|
  install-sh$|
  shconfig$|shconfig\.in$)
repos:
  - repo: https://github.com/executablebooks/mdformat
    # Do this before other tools "fixing" the line endings
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # 1.0.0
    hooks:
      - id: mdformat
        name: Format Markdown
        stages: [manual]
        entry: mdformat  # Executable to run, with fixed options
        language: python
        types: [markdown]
        # --wrap 80 dropped (commented): upstream-maintained markdown has long
        # lines the hook would rewrite (rsync.1.md, rsyncd.conf.5.md, NEWS.md,
        # testsuite/README.md)
        # args: [--wrap, '80', --number]
        args: [--number]
        additional_dependencies:
          - mdformat-toc
          - mdformat-gfm
          - mdformat-beautysh
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      # - id: no-commit-to-branch
      #  args: [--branch, main]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: mixed-line-ending
      - id: check-builtin-literals
      - id: check-ast
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      # check-shebang-scripts-are-executable is intentionally not enabled:
      # scripts keep their shebangs without the executable bit (upstream
      # #1189) — they are not meant to be invoked directly, so modes stay
      # as in master.
      - id: check-docstring-first
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-toml
  - repo: https://github.com/lovesegfault/beautysh.git
    rev: 885128fe2600889194c69fa19326cf55a3462777  # v6.4.3
    hooks:
      - id: beautysh
        exclude: ^(config.guess|config.sub|rsync-ssl)$
        args: [--indent-size=4]
        additional_dependencies:
          - setuptools
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # v2.4.3
    hooks:
      - id: codespell
        # scripts/updateCodespellIgnoreFile.sh updates the ignore file.
        # deapon-parm.awk no longer exists on master; config.guess/config.sub
        # stay excluded; vendored zlib/ and popt/ are not corrected.
        exclude: ^(configure\.ac|config\.guess|config\.sub|wildtest\.txt)$|^(zlib|popt)/
        args:
          - --builtin=clear,informal,names
          # Sargeant: NEWS.md credits contributor "Will Sargeant"; do not "fix"
          # abd: deliberate non-matching string in t_iwildmatch.c test cases
          - --ignore-words-list=te,uptodate,siz,mis,ake,chang,ue,cna,devine,seein,noo,servent,tim,parms,unx,blong,sorce,Sargeant,abd
        #  - -xscripts/codespell-lines-ignore.txt
        #  - --toml
        #  - pyproject.toml
        additional_dependencies:
          - tomli
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: 82434ac5752cd3b40f6e65e7751c054157accc0b  # v1.5.0
    # Install dependencies on windows:
    #  choco install llvm uncrustify cppcheck
    hooks:
      - id: uncrustify
        stages: [manual]
        # vendored code and C test fixtures are not application code
        exclude: ^(zlib|popt)/|^testsuite/fixtures/chmod-error\.c$
        args: [--replace, --no-backup, -c, uncrustify.cfg, -l, C]
      - id: cppcheck
        stages: [manual]
        exclude: ^(case_N\.h|testsuite/fixtures/chmod-error\.c)$|^(zlib|popt)/
        args:
          - --quiet
          - --force
          - --platform=unix32
          - --language=c
          - --cppcheck-build-dir=.cache/cppcheck/
          - -Uisblank
          - -DSIZEOF_CHARP=8
          - -DZLIB_CONST
          - -DICONV_OPTION
          - -DCAN_CHMOD_SYMLINK
          - -DCAN_CHOWN_SYMLINK
          - -DCAN_SET_NSEC
          - -DCAN_SET_SYMLINK_TIMES
          - -DLOG_AUTH
          - -DLOG_AUTHPRIV
          - -DLOG_CRON
          - -DLOG_DAEMON
          - -DLOG_FTP
          - -DLOG_KERN
          - -DLOG_LOCAL0
          - -DLOG_LOCAL1
          - -DLOG_LOCAL2
          - -DLOG_LOCAL3
          - -DLOG_LOCAL4
          - -DLOG_LOCAL5
          - -DLOG_LOCAL6
          - -DLOG_LOCAL7
          - -DLOG_LPR
          - -DLOG_MAIL
          - -DLOG_NDELAY
          - -DLOG_NEWS
          - -DLOG_SYSLOG
          - -DLOG_USER
          - -DLOG_UUCP
          - -DSUPPORT_ACLS
          - -DSUPPORT_ACL_FD
          - -DSUPPORT_CRTIMES
          - -DSUPPORT_HARD_LINKS
          - -DSUPPORT_IDN
          - -DSUPPORT_IO_PRIORITY
          - -DSUPPORT_LINKS
          - -DSUPPORT_LZ4
          - -DSUPPORT_NICE_PRIORITY
          - -DSUPPORT_PREALLOCATION
          - -DSUPPORT_XATTRS
          - -DSUPPORT_XXH3
          - -DSUPPORT_XXHASH
          - -DSUPPORT_ZSTD
          - -DNORETURN=
          - -DPOPT_fprintf=fprintf
          # config.h is generated (gitignored), so cppcheck never sees it in CI.
          # Define HAVE_GETGROUPS so the real getgroups() code paths are analyzed
          # (upstream #1195: without this, cppcheck suggests const on the buffer
          # that getgroups() writes into).
          - -DHAVE_GETGROUPS
          #- -DVARN="value"   # For static analysis
          - -I.
          - '--template={file}({line}): {severity} ({id}): {message}'
          - --inline-suppr
          - --check-level=exhaustive
          - --suppress=unmatchedSuppression
          - --suppress=checkersReport
          - --suppress=internalError
          # - --suppress=constParameterPointer
          - --suppress=variableScope
          - --suppress=constParameterPointer
          - --suppress=constParameterCallback
          - --suppress=unusedFunction
          - --suppress=missingIncludeSystem
          # Generated headers (config.h, git-version.h, default-cvsignore.h,
          # default-dont-compress.h, daemon-parm.h, help-rsync*.h, rounding.h)
          # are gitignored and absent on a fresh checkout; -I. above resolves
          # them at the project root once the build has generated them.
          # Suppress the resulting missingInclude notices in the files that
          # include them (filename only, no line numbers — they shift easily).
          - --suppress=missingInclude:usage.c
          - --suppress=missingInclude:flist.c
          - --suppress=missingInclude:log.c
          - --suppress=missingInclude:loadparm.c
          - --suppress=missingInclude:lib/snprintf.c
          - --suppress=missingInclude:testsuite/tools/dirfd-probe.c
          - --suppress=missingInclude:rsync.h
          - --suppress=shiftTooManyBits:byteorder.h
          - --suppress=unusedStructMember:rsync.h
          - --suppress=unusedStructMember:lib/pool_alloc.c
          - --suppress=unusedStructMember:lib/sysacls.h
          - --suppress=missingInclude:lib/sysacls.h

  - repo: https://github.com/cpplint/cpplint
    rev: 350702a4d39395571bd118c9a3cff0a573488d61  # 2.0.2
    hooks:
      - id: cpplint
        stages: [manual]
        exclude: ^(zlib|popt)/|^testsuite/fixtures/chmod-error\.c$
        args: ["--filter=-legal/copyright,-build/header_guard,-build/include_dir,-build/include_subdir,-readability/braces,-readability/casting,-readability/multiline_comment,-whitespace/blank_line,-whitespace/braces,-whitespace/comma,-whitespace/indent,-whitespace/line_length,-whitespace/newline,-whitespace/operators,-whitespace/parens,-whitespace/semicolon,-whitespace/tab"]
        additional_dependencies:
          - cpplint>=1.6.1
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # v0.11.0.1-1
    hooks:
      - id: shellcheck
        exclude: ^(config\.guess|config\.sub)$
        # exclude: (?x)^(__NONE__)$
        # args: [-x,-e1007,-e1009,-e1072,-e1073]
