# Miraex ontology skeleton for the ontology_substrate package.
# Modeled on the canonical icalps fixture (7_entity_icload_style.yaml) with
# miraex_* naming. FILL_ME markers are portal constants that MUST be probed from
# the live target portal (association type IDs, mirror columns) — icalps values
# are portal-specific and non-transferable.
#
# Copy to ontology/miraex_ontology.yaml (git-ignored — the filled file carries
# probed portal constants that stay out of this public repo) when filling
# FILL_ME values, then validate with:
#   python -m ontology_substrate probe --ontology miraex_ontology.yaml --dry-run
#
# Cardinality convention: source:target reading. The substrate-documented value
# vocabulary is 1:1 / 1:N / N:M — verify via the dry-run that "N:1" parses; if
# it does not, flip the affected edges' source/target and use 1:N.

target_system:
  adapter: hubspot
  config:
    reconciliation_id_prefix: miraex_

sync_provider:
  # RESOLVED (Q1, 2026-08-06): hybrid like icalps — CRM entities go through the
  # mirror provider; the document entity bypasses it (direct API + ledger).
  # Mirror record-id columns are per-connection constants: discover in Phase 0,
  # then fill mirror_table/mirror_pk_col below for company/contact/deal.
  adapter: stacksync
  config: {}

layers:
  - name: source_odoo
    kind: csv_files
    glob: "bronze_layer/odoo_*.csv"
  - name: source_drive
    kind: filesystem            # served by the new FilesystemConnector
    glob: "drive/**"
  - name: bronze
    kind: csv_files
    glob: "bronze_layer/Bronze_*.csv"
  - name: silver
    kind: postgres
    schema: staging_miraex
  - name: gold
    kind: postgres_mirror_via_sync_provider   # or api snapshot exports in direct_api mode
    schema: hubspot

entities:
  - name: company
    bronze_table: Bronze_Company.csv
    bronze_pk: miraex_company_id  # curated master-list key (union of Odoo export,
                                  # Drive folder names, summary sheets — Drive
                                  # exports carry no source record ids)
    silver_table: stg_company_normalised
    silver_pk: miraex_company_id
    mirror_table: null            # FILL_ME if mirror mode
    mirror_pk_col: null
    mirror_reconciliation_id_col: miraex_company_id

  - name: contact                 # fair/exhibition contacts included
    bronze_table: Bronze_Contact.csv
    bronze_pk: miraex_contact_id  # odoo id or evt:<sha1> synthetic key
    silver_table: stg_contact_normalised
    silver_pk: miraex_contact_id
    mirror_table: null
    mirror_pk_col: null
    mirror_reconciliation_id_col: miraex_contact_id
    silver_marts:
      - name: fair_contacts
        path: stg_fair_contacts
        unique_id_pattern: "evt:<sha1(event|email|name)[:12]>"   # sole dedup when dedup is off; single-sourced with PLAN.md/AGENTS.md
        scope: fair/exhibition ingests
        cardinality_note: contact may attend N events; event key is a property, not an entity (v1)
        write_mode: upsert

  - name: deal
    bronze_table: Bronze_Deal.csv
    bronze_pk: miraex_deal_id   # SYNTHETIC (Q3): hash of normalised opportunity
                                # name + business line — the Drive exports carry
                                # no Odoo record ids; key frozen at first write
    silver_table: stg_deal_normalised
    silver_pk: miraex_deal_id
    mirror_table: null
    mirror_pk_col: null
    mirror_reconciliation_id_col: miraex_deal_id

  - name: document                # the library file — Files+Notes carrier model
    bronze_table: null            # source is the walked filesystem (source_drive)
    bronze_pk: miraex_doc_id      # fs:<sha1(relpath)[:12]>
    silver_table: stg_library_normalised
    silver_pk: miraex_doc_id
    mirror_table: null
    mirror_pk_col: null
    mirror_reconciliation_id_col: miraex_doc_id

edges:
  - name: contact_company
    source: contact
    target: company
    cardinality: "N:1"            # confirm for fair contacts (Q: N:M?)
    silver_source_fk: miraex_company_id
    expected_from: bronze
    types: []                     # FILL_ME: probe portal labels both directions

  - name: deal_company
    source: deal
    target: company
    cardinality: "N:1"
    silver_source_fk: miraex_company_id
    expected_from: bronze
    # fk_violation_policy: REJECT (silver validation, schema_context precedent);
    # portal_constraint is reserved for probed portal label limits (e.g. limit=1)
    types: []                     # FILL_ME

  - name: deal_contact
    source: deal
    target: contact
    cardinality: "N:1"            # confirm: multiple contacts per deal?
    silver_source_fk: miraex_contact_id
    expected_from: bronze
    # fk_violation_policy: WARN (silver validation)
    types: []                     # FILL_ME

  - name: document_company
    source: document
    target: company
    cardinality: "N:1"
    silver_source_fk: miraex_company_id   # resolved from path via map_folder_company
    expected_from: bronze                 # denominator = filesystem count
    types: []                     # v4 default association via note carrier
